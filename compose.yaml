services:
  stationos:
    build: .
    command: ["-listen", "0.0.0.0:8080", "-db", "/data/stationos.db", "-public-url", "${STATIONOS_PUBLIC_URL:-}"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      STATIONOS_ADMIN_PASSWORD: ${STATIONOS_ADMIN_PASSWORD:-}
    volumes:
      - stationos-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  stationos-data:
